server:
  port: 8081

spring:
  application:
    name: escrow-platform
  datasource:
    url: jdbc:h2:mem:escrow;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    # url: jdbc:postgresql://localhost:5432/escrow_platform
    # driver-class-name: org.postgresql.Driver
    # username: postgres
    # password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

web3:
  rpc-url: ${WEB3_RPC_URL:https://eth-sepolia.g.alchemy.com/v2/demo}
  escrow-address: ${ESCROW_ADDRESS:0x0000000000000000000000000000000000000000}
  # Block to start listening for events from - use the contract's deployment
  # block so the listener doesn't have to scan the whole chain history.
  start-block: ${START_BLOCK:0}

jwt:
  # Demo-only secret - override via env var in anything beyond local dev.
  secret: ${JWT_SECRET:change-this-to-a-long-random-string-before-deploying-anywhere-real}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
