# Contracts CI: tests (incl. attack and randomized tests), mutation check of the security fixes,
# and a Slither gate on the fixed contract. Runs on every push and pull request.
name: Contracts

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    name: Hardhat tests + mutation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Tests (original 10, attacks on original and V2, randomized invariant)
        run: npx hardhat test
      - name: Mutation check (undo each V2 fix; the tests must catch all 11)
        run: node scripts/mutation-check.js

  slither:
    name: Slither (gate on MilestoneEscrowV2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Slither and solc 0.8.24
        run: |
          pip install slither-analyzer==0.11.3 solc-select==1.1.0
          solc-select install 0.8.24
          solc-select use 0.8.24
      - name: Report on the original (deployed) contract, for the record
        run: slither contracts/MilestoneEscrow.sol --solc-remaps "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/" --exclude-dependencies --fail-none
      - name: Gate on V2 (only detectors triaged in security/SLITHER_TRIAGE.md are excluded)
        run: |
          slither contracts/MilestoneEscrowV2.sol \
            --solc-remaps "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/" \
            --exclude-dependencies \
            --exclude incorrect-equality,timestamp,pragma,low-level-calls,solc-version,assembly \
            --fail-low
